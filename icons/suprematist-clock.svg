<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="!C?@5<0B8ABA:85 G0AK">
  <!-- Mini suprematist clock face  same palette as the app -->
  <rect width="512" height="512" fill="#050505"/>

  <!-- Asymmetric field accents -->
  <rect x="28" y="318" width="88" height="148" fill="#15245e"/>
  <rect x="360" y="52" width="118" height="22" fill="#e0b83a" transform="rotate(8 360 52)"/>
  <circle cx="430" cy="400" r="42" fill="none" stroke="#f5f2ea" stroke-width="10" opacity="0.85"/>

  <!-- Clock face -->
  <circle cx="256" cy="256" r="168" fill="#ebe4d4"/>

  <!-- Malevich black square overlapping the face -->
  <rect x="78" y="72" width="118" height="118" fill="#0c0c0c"/>

  <!-- Face accents -->
  <rect x="308" y="102" width="42" height="42" fill="#c0152a"/>
  <rect x="86" y="310" width="64" height="14" fill="#15245e"/>
  <circle cx="148" cy="158" r="10" fill="#e0b83a"/>

  <!-- Hour marks (12 majors) -->
  <g stroke="#0c0c0c" stroke-linecap="square">
    <line x1="256" y1="100" x2="256" y2="118" stroke-width="5"/>
    <line x1="256" y1="394" x2="256" y2="412" stroke-width="5"/>
    <line x1="100" y1="256" x2="118" y2="256" stroke-width="5"/>
    <line x1="394" y1="256" x2="412" y2="256" stroke-width="5"/>
    <line x1="145.5" y1="145.5" x2="158.2" y2="158.2" stroke-width="5"/>
    <line x1="353.8" y1="353.8" x2="366.5" y2="366.5" stroke-width="5"/>
    <line x1="366.5" y1="145.5" x2="353.8" y2="158.2" stroke-width="5"/>
    <line x1="158.2" y1="353.8" x2="145.5" y2="366.5" stroke-width="5"/>
  </g>

  <!-- Hands at ~10:10 (recognizable clock pose) -->
  <g transform="rotate(-60 256 256)">
    <rect x="248" y="138" width="16" height="126" fill="#0c0c0c"/>
  </g>
  <g transform="rotate(60 256 256)">
    <rect x="250" y="92" width="12" height="172" fill="#15245e"/>
  </g>
  <g transform="rotate(150 256 256)">
    <line x1="256" y1="280" x2="256" y2="78" stroke="#c0152a" stroke-width="3" stroke-linecap="square"/>
    <rect x="252" y="260" width="8" height="36" fill="#c0152a"/>
  </g>

  <!-- Hub -->
  <circle cx="256" cy="256" r="14" fill="#0c0c0c"/>
  <circle cx="256" cy="256" r="8" fill="#c0152a"/>
  <circle cx="256" cy="256" r="4" fill="#e0b83a"/>
</svg>
